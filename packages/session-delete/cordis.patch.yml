# bundle patch for the session-delete plugin: inserts its plugin row into the
# web profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/session-delete`.
- insert:
    - id: ui-session-delete
      name: '@linxin666/dsh-client-ui-session-delete'
