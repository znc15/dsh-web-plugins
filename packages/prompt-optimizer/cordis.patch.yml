# bundle patch for the prompt-optimizer plugin: inserts its plugin row into the
# web profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/prompt-optimizer`.
- insert:
    - id: ui-prompt-optimizer
      name: '@linxin666/dsh-client-ui-prompt-optimizer'
